<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace Project Tasks - interaction reference</title>
<style>
html { color-scheme: light dark; }
body { margin: 0; padding: 16px; background: light-dark(#ffffff, #18191d); }
</style>
</head>
<body>
<div id="wt-project-board" lang="zh-CN">
  <style>
    #wt-project-board {
      --wt-bg: light-dark(#f8f9fb, #202126);
      --wt-panel: light-dark(#ffffff, #292b32);
      --wt-side: light-dark(#eff0f3, #191a1f);
      --wt-line: light-dark(#d5d8df, #484b56);
      --wt-ink: light-dark(#242830, #f0f1f5);
      --wt-muted: light-dark(#5c6473, #b9bfcc);
      --wt-accent: light-dark(#255ec2, #a7c5ff);
      --wt-accent-bg: light-dark(#e8effd, #2c3a53);
      --wt-action: light-dark(#255ec2, #a7c5ff);
      --wt-action-ink: light-dark(#ffffff, #122343);
      --wt-good: light-dark(#23744b, #91d5ae);
      --wt-warn: light-dark(#85540c, #f2c477);
      --wt-warn-bg: light-dark(#fff4df, #423720);
      --wt-danger: light-dark(#ae303b, #ffabb4);
      color: var(--wt-ink); font: 400 1rem/1.5 "Segoe UI Variable", "Microsoft YaHei UI", system-ui, sans-serif;
      width: 100%; color-scheme: inherit;
    }
    #wt-project-board * { box-sizing: border-box; }
    #wt-project-board [hidden] { display: none !important; }
    #wt-project-board button, #wt-project-board input, #wt-project-board textarea, #wt-project-board select { font: inherit; color: inherit; }
    #wt-project-board button { cursor: pointer; }
    #wt-project-board button:disabled { cursor: default; opacity: .55; }
    #wt-project-board .wt-window { background: var(--wt-bg); border: 1px solid var(--wt-line); border-radius: 9px; }
    #wt-project-board .wt-chrome { background: var(--wt-side); border-radius: 9px 9px 0 0; border-bottom: 1px solid var(--wt-line); padding: 9px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .875rem; }
    #wt-project-board .wt-mark { color: var(--wt-accent); font-family: monospace; font-size: 1.125rem; }
    #wt-project-board .wt-draft { margin-left: auto; color: var(--wt-muted); }
    #wt-project-board .wt-shell { display: grid; grid-template-columns: 150px minmax(0, 1fr); }
    #wt-project-board .wt-sidebar { background: var(--wt-side); border-right: 1px solid var(--wt-line); padding: 16px 9px; border-radius: 0 0 0 9px; }
    #wt-project-board .wt-caption { color: var(--wt-muted); font-size: .875rem; }
    #wt-project-board .wt-side-label { padding: 0 9px 11px; display: block; }
    #wt-project-board .wt-project { width: 100%; border: 1px solid transparent; padding: 11px 9px; margin-bottom: 5px; background: transparent; text-align: left; border-radius: 6px; overflow-wrap: anywhere; }
    #wt-project-board .wt-project[aria-pressed="true"] { background: var(--wt-accent-bg); border-color: var(--wt-line); }
    #wt-project-board .wt-project strong { display: block; font-weight: 500; }
    #wt-project-board .wt-project small { display: block; color: var(--wt-muted); font-size: .875rem; margin-top: 4px; }
    #wt-project-board .wt-main { min-width: 0; padding: 16px; }
    #wt-project-board .wt-heading { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
    #wt-project-board h2 { font-family: inherit; font-size: 1.25rem; line-height: 1.4; font-weight: 500; margin: 0 0 3px; }
    #wt-project-board h3 { font-family: inherit; font-size: 1.125rem; line-height: 1.4; font-weight: 500; margin: 0; }
    #wt-project-board h4 { font-family: inherit; font-size: 1rem; font-weight: 500; margin: 0; }
    #wt-project-board .wt-tabs { display: flex; flex-wrap: wrap; gap: 16px; border-bottom: 1px solid var(--wt-line); margin: 15px 0 14px; }
    #wt-project-board .wt-tab { border: 0; border-bottom: 2px solid transparent; padding: 7px 2px; background: transparent; font-size: .875rem; }
    #wt-project-board .wt-tab[aria-pressed="true"] { border-color: var(--wt-accent); color: var(--wt-accent); font-weight: 500; }
    #wt-project-board .wt-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
    #wt-project-board .wt-button { border: 1px solid var(--wt-line); background: var(--wt-panel); border-radius: 5px; padding: 7px 10px; min-height: 36px; font-size: .875rem; }
    #wt-project-board .wt-primary { background: var(--wt-action); border-color: var(--wt-action); color: var(--wt-action-ink); }
    #wt-project-board .wt-quiet { background: transparent; }
    #wt-project-board .wt-button:hover { filter: brightness(.97); }
    #wt-project-board .wt-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    #wt-project-board .wt-stage { min-width: 0; }
    #wt-project-board .wt-board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: stretch; }
    #wt-project-board .wt-column { min-width: 0; min-height: 300px; border: 1px solid transparent; border-radius: 7px; padding: 0 3px 12px; }
    #wt-project-board .wt-column.wt-over { border-color: var(--wt-accent); background: var(--wt-accent-bg); }
    #wt-project-board .wt-column-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .875rem; margin-bottom: 11px; padding: 3px 1px; }
    #wt-project-board .wt-dot { border: 2px solid currentColor; display: inline-block; width: 9px; height: 9px; border-radius: 50%; color: var(--wt-muted); flex-shrink: 0; }
    #wt-project-board [data-column="doing"] .wt-dot { color: var(--wt-accent); background: var(--wt-accent); }
    #wt-project-board [data-column="review"] .wt-dot { color: var(--wt-warn); }
    #wt-project-board [data-column="done"] .wt-dot { color: var(--wt-good); background: var(--wt-good); }
    #wt-project-board .wt-count { color: var(--wt-muted); margin-left: auto; font-variant-numeric: tabular-nums; }
    #wt-project-board .wt-task { border: 1px solid var(--wt-line); background: var(--wt-panel); border-radius: 7px; padding: 11px 10px; margin-bottom: 10px; cursor: grab; overflow-wrap: anywhere; }
    #wt-project-board .wt-task[aria-current="true"] { border-color: var(--wt-accent); box-shadow: 0 0 0 1px var(--wt-accent); }
    #wt-project-board .wt-task.wt-dragging { opacity: .45; }
    #wt-project-board .wt-task-top { display: flex; justify-content: space-between; gap: 6px; color: var(--wt-muted); font-size: .875rem; margin-bottom: 7px; }
    #wt-project-board .wt-open { display: block; width: 100%; text-align: left; background: transparent; border: 0; padding: 0; line-height: 1.5; font-size: 1rem; }
    #wt-project-board .wt-task-meta { display: flex; flex-wrap: wrap; gap: 5px 8px; color: var(--wt-muted); font-size: .875rem; margin-top: 12px; }
    #wt-project-board .wt-agent { color: var(--wt-muted); }
    #wt-project-board .wt-state { display: block; font-size: .875rem; margin-top: 9px; color: var(--wt-muted); }
    #wt-project-board .wt-state.running { color: var(--wt-accent); }
    #wt-project-board .wt-state.waiting, #wt-project-board .wt-state.blocked { color: var(--wt-warn); }
    #wt-project-board .wt-state.finished { color: var(--wt-good); }
    #wt-project-board .wt-empty { color: var(--wt-muted); padding: 24px 8px; text-align: center; border: 1px dashed var(--wt-line); border-radius: 6px; font-size: .875rem; }
    #wt-project-board .wt-inspector { background: var(--wt-panel); border: 1px solid var(--wt-line); border-radius: 7px; padding: 16px; margin-top: 16px; min-width: 0; overflow-wrap: anywhere; }
    #wt-project-board .wt-inspector[hidden] { display: none; }
    #wt-project-board .wt-detail-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
    #wt-project-board .wt-detail-head .wt-button { flex: 0 0 auto; }
    #wt-project-board .wt-field { display: grid; gap: 5px; margin: 12px 0; font-size: .875rem; color: var(--wt-muted); }
    #wt-project-board input, #wt-project-board textarea, #wt-project-board select { min-width: 0; width: 100%; border: 1px solid var(--wt-line); border-radius: 5px; padding: 8px; background: var(--wt-bg); color: var(--wt-ink); font-size: 1rem; }
    #wt-project-board textarea { resize: vertical; min-height: 76px; }
    #wt-project-board .wt-description { margin: 12px 0; }
    #wt-project-board .wt-detail-block { border-top: 1px solid var(--wt-line); padding-top: 13px; margin-top: 16px; }
    #wt-project-board .wt-timeline { margin: 10px 0 0; padding-left: 20px; color: var(--wt-muted); font-size: .875rem; }
    #wt-project-board .wt-timeline li { margin: 7px 0; }
    #wt-project-board .wt-warning { background: var(--wt-warn-bg); color: var(--wt-warn); border-radius: 5px; padding: 11px; margin-bottom: 12px; }
    #wt-project-board .wt-note { border-top: 1px solid var(--wt-line); padding-top: 12px; margin-top: 12px; font-size: .875rem; color: var(--wt-muted); }
    #wt-project-board .wt-feedback { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; min-height: 45px; padding: 8px 15px; border-top: 1px solid var(--wt-line); font-size: .875rem; color: var(--wt-muted); }
    #wt-project-board .wt-feedback button { font-size: .875rem; background: transparent; border: 0; text-decoration: underline; color: var(--wt-accent); padding: 4px; }
    #wt-project-board .wt-terminal { background: light-dark(#20242c, #16191f); color: light-dark(#e3e9f3, #e3e9f3); padding: 15px; border-radius: 6px; min-height: 220px; }
    #wt-project-board .wt-terminal pre { font: 400 .875rem/1.8 Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
    #wt-project-board .wt-summary-row { padding: 14px 0; border-bottom: 1px solid var(--wt-line); }
    #wt-project-board .wt-view-switch { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--wt-line); border-radius: 7px; background: var(--wt-side); }
    #wt-project-board .wt-view-switch button { border: 0; background: transparent; border-radius: 4px; padding: 5px 12px; font-size: .875rem; }
    #wt-project-board .wt-view-switch button[aria-pressed="true"] { background: var(--wt-panel); color: var(--wt-accent); }
    #wt-project-board .wt-filters { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    #wt-project-board .wt-filters label { display: flex; align-items: center; gap: 5px; font-size: .875rem; }
    #wt-project-board .wt-filters input[type="radio"] { width: auto; accent-color: var(--wt-accent); }
    #wt-project-board .wt-filters input[type="search"] { flex: 1 1 190px; font-size: .875rem; }
    #wt-project-board .wt-filters select { flex: 0 1 145px; width: auto; font-size: .875rem; }
    #wt-project-board .wt-task-list { display: grid; gap: 5px; }
    #wt-project-board .wt-list-item { border: 1px solid transparent; border-radius: 6px; background: transparent; padding: 11px; text-align: left; min-width: 0; overflow-wrap: anywhere; }
    #wt-project-board .wt-list-item[aria-pressed="true"] { background: var(--wt-accent-bg); border-color: var(--wt-line); }
    #wt-project-board .wt-list-item strong { display: block; font-weight: 500; margin: 5px 0; }
    #wt-project-board .wt-list-item span { display: block; font-size: .875rem; color: var(--wt-muted); }
    #wt-project-board .wt-list-item-head { display: flex; justify-content: space-between; gap: 8px; }
    #wt-project-board .wt-picker { display: none; }
    #wt-project-board #wt-stage.wt-full-detail { display: block; }
    #wt-project-board .wt-full-detail .wt-inspector { margin-top: 0; }
    #wt-project-board .wt-detail-columns { display: grid; gap: 16px; min-width: 0; }
    #wt-project-board .wt-detail-body { min-width: 0; }
    #wt-project-board .wt-properties { padding: 13px; border: 1px solid var(--wt-line); border-radius: 6px; background: var(--wt-bg); min-width: 0; }
    #wt-project-board .wt-properties dl { margin: 12px 0 0; font-size: .875rem; }
    #wt-project-board .wt-properties dt { color: var(--wt-muted); margin-top: 12px; }
    #wt-project-board .wt-properties dd { margin: 4px 0 0; overflow-wrap: anywhere; }
    #wt-project-board .wt-criterion { display: flex; align-items: flex-start; gap: 8px; margin: 9px 0; }
    #wt-project-board .wt-criterion input { width: auto; margin-top: 6px; accent-color: var(--wt-accent); flex-shrink: 0; }
    #wt-project-board .wt-selection-title { margin-bottom: 8px; }
    #wt-project-board .wt-global-nav { border-top: 1px solid var(--wt-line); margin-top: 18px; padding-top: 12px; }
    #wt-project-board .wt-agent-catalog { display: grid; gap: 18px; min-width: 0; }
    #wt-project-board .wt-agent-editor { padding: 16px; background: var(--wt-panel); border: 1px solid var(--wt-line); border-radius: 7px; min-width: 0; }
    #wt-project-board .wt-agent-list { display: grid; gap: 6px; margin-top: 12px; }
    #wt-project-board .wt-agent-description { margin-bottom: 14px; color: var(--wt-muted); }
    #wt-project-board .wt-agent-preview { white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--wt-line); border-radius: 6px; padding: 12px; margin-top: 12px; background: var(--wt-bg); }
    #wt-project-board .wt-overrides { margin-top: 12px; }
    #wt-project-board .wt-overrides summary { cursor: pointer; color: var(--wt-muted); font-size: .875rem; }
    #wt-project-board .wt-save-state { color: var(--wt-muted); font-size: .875rem; margin: 5px 0 12px; }
    @media (min-width: 950px) { #wt-project-board .wt-agent-catalog { grid-template-columns: 235px minmax(0,1fr); align-items: start; } }
    @media (max-width: 700px) { #wt-project-board .wt-global-nav { border-top: 0; padding: 0; margin: 0; } }
    @media (min-width: 901px) { #wt-project-board #wt-stage.wt-list-layout { display: grid; grid-template-columns: 220px minmax(0,1fr); gap: 16px; align-items: start; } #wt-project-board .wt-list-layout .wt-inspector { margin-top: 0; } }
    @media (max-width: 900px) { #wt-project-board .wt-task-list, #wt-project-board .wt-selection-title { display: none; } #wt-project-board .wt-picker { display: grid; gap: 6px; font-size: .875rem; color: var(--wt-muted); } }
    @media (min-width: 1250px) { #wt-project-board .wt-detail-columns { grid-template-columns: minmax(0,1fr) 215px; align-items: start; } }
    @media (min-width: 1080px) { #wt-project-board .wt-stage.wt-detail-open { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; } #wt-project-board .wt-stage.wt-detail-open .wt-inspector { margin-top: 0; } }
    @media (max-width: 700px) { #wt-project-board .wt-shell { display: block; } #wt-project-board .wt-sidebar { border-right: 0; border-bottom: 1px solid var(--wt-line); border-radius: 0; padding: 8px; display: flex; gap: 7px; align-items: center; flex-wrap: wrap; } #wt-project-board .wt-side-label { padding: 4px; } #wt-project-board #wt-projects { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; } #wt-project-board .wt-project { width: auto; margin: 0; padding: 6px 10px; } #wt-project-board .wt-project small { display: none; } }
    @media (max-width: 580px) { #wt-project-board .wt-board { grid-template-columns: repeat(2, minmax(0, 1fr)); } #wt-project-board .wt-column { min-height: 170px; } #wt-project-board .wt-main { padding: 12px; } }
    @media (max-width: 350px) { #wt-project-board .wt-board { grid-template-columns: minmax(0, 1fr); } }
    @media (prefers-reduced-motion: reduce) { #wt-project-board .wt-column { transition: none; } }
  </style>
  <div class="wt-window">
    <div class="wt-chrome"><span class="wt-mark" aria-hidden="true">&gt;_</span><span>Windows Terminal</span><span class="wt-draft">交互草案 · 演示数据</span></div>
    <div class="wt-shell">
      <aside class="wt-sidebar" aria-label="项目切换"><span class="wt-caption wt-side-label">项目</span><div id="wt-projects"></div><div class="wt-global-nav"><button type="button" class="wt-project" id="wt-agents-global" aria-pressed="false">Agent 管理</button></div></aside>
      <main class="wt-main">
        <div class="wt-heading"><div><h2 id="wt-project-name">Win Terminal</h2><div id="wt-project-context" class="wt-caption"></div></div><div class="wt-actions" id="wt-task-header-actions"><button type="button" class="wt-button" data-action="manage-agents">管理 Agent</button><button type="button" class="wt-button wt-primary" id="wt-new-task">＋ 新建任务</button></div></div>
        <nav class="wt-tabs" id="wt-project-tabs" aria-label="项目视图"><button type="button" class="wt-tab" data-view="board" aria-pressed="true">任务</button><button type="button" class="wt-tab" data-view="terminal" aria-pressed="false">终端</button><button type="button" class="wt-tab" data-view="summary" aria-pressed="false">结论</button></nav>
        <div class="wt-toolbar" id="wt-toolbar"><div class="wt-actions"><div class="wt-view-switch" role="group" aria-label="任务显示方式"><button type="button" data-layout="board" aria-pressed="false">看板</button><button type="button" data-layout="list" aria-pressed="true">列表</button></div><button type="button" class="wt-button wt-quiet" id="wt-backlog">待规划</button><button type="button" class="wt-button wt-quiet" id="wt-cancelled" hidden>已取消</button></div><span id="wt-view-caption" class="wt-caption">任务列表与完整详情</span></div>
        <div class="wt-filters" id="wt-filters"><label><input type="radio" name="task-scope" value="current" checked>当前项目</label><label><input type="radio" name="task-scope" value="all">全部项目</label><input id="wt-search" type="search" aria-label="搜索任务" placeholder="搜索任务、编号或项目"><select id="wt-filter" aria-label="筛选任务状态"><option value="all">全部状态</option><option value="open">未完成</option><option value="todo">待办</option><option value="doing">进行中</option><option value="review">待验收</option><option value="blocked">受阻</option><option value="done">已完成</option></select></div>
        <div class="wt-stage" id="wt-stage"><div id="wt-content"></div><section class="wt-inspector" id="wt-inspector" aria-label="任务详情" hidden></section></div>
      </main>
    </div>
    <div class="wt-feedback" role="status" aria-live="polite" aria-atomic="true"><span id="wt-feedback-text">项目中的任务、终端和执行记录保存在一起。</span><button type="button" id="wt-undo" hidden>撤销</button></div>
  </div>
  <script>
  (() => {
    const root = document.getElementById('wt-project-board');
    const byId = id => root.querySelector('#' + id);
    const projects = [{id:'wt',name:'Win Terminal',folder:'win_terminal',agent:'Codex'}, {id:'rl',name:'RicherLife',folder:'richerlife',agent:'代码审查'}];
    const agents=[
      {id:'codex',name:'Codex',description:'日常开发与问题修复',model:'',instructions:'理解项目要求后完成任务，并提供验证结果。',version:1,archived:false},
      {id:'review',name:'代码审查',description:'关注正确性、资源生命周期和测试覆盖',model:'',instructions:'检查代码变更，说明问题的影响和位置，给出可操作的修改建议。',version:2,archived:false},
      {id:'tests',name:'测试助手',description:'围绕验收条件补充与执行测试',model:'',instructions:'围绕任务的验收条件设计测试，报告执行结果和未覆盖的场景。',version:1,archived:false}
    ];
    const labels = {backlog:'待规划',todo:'待办',doing:'进行中',review:'待验收',blocked:'受阻',done:'已完成',cancelled:'已取消'};
    const allowed = {backlog:['todo','cancelled'],todo:['backlog','doing','cancelled'],doing:['todo','review','blocked','cancelled'],review:['doing','done','cancelled'],blocked:['todo','doing','cancelled'],done:['todo'],cancelled:['todo']};
    const tasks = [
      {id:'WT-24',project:'wt',title:'按项目组织任务看板',state:'todo',agent:'Codex',priority:'高',run:'idle',round:0,description:'一个 Workspace 对应一个项目。任务可按状态拖拽，切换项目时保留各自的看板和终端。',history:['创建任务，等待执行']},
      {id:'WT-25',project:'wt',title:'项目默认 Agent 配置',state:'todo',agent:'',priority:'中',run:'idle',round:0,description:'在项目中设置默认执行者，新建任务继承该设置，也可以单独指定。',history:['创建任务，尚未选择 Agent']},
      {id:'WT-23',project:'wt',title:'恢复项目终端会话',state:'doing',agent:'Codex',priority:'高',run:'waiting',round:1,description:'再次打开项目时，恢复上次的终端布局，并保留任务与终端的关联。',history:['第 1 次执行已开始','Agent 等待输入：重开项目时，需要恢复全部终端吗？']},
      {id:'WT-21',project:'wt',title:'修复关闭 Workspace 闪退',state:'review',agent:'Codex',priority:'高',run:'finished',round:1,description:'关闭当前工作区后，其他工作区应继续可用。只有关闭最后一个工作区时才退出窗口。',result:'已复测当前及后台 Workspace 关闭，新增两项回归测试，完整验收通过。',history:['第 1 次执行完成','提交结果，等待人工验收']},
      {id:'WT-18',project:'wt',title:'精简侧栏目录显示',state:'done',agent:'Codex',priority:'中',run:'finished',round:1,description:'目录显示项目名和必要的父路径，完整路径可在项目详情中查看。',result:'目录显示已调整，已完成验收。',history:['第 1 次执行完成','你已验收通过']},

      byId('wt-project-name').textContent=view==='agents'?'Agent 管理':current.name;
      byId('wt-project-context').textContent=view==='agents'?'全局配置 · 项目默认设置目标：'+current.name:current.folder+' · 默认 '+(current.agent||'未设置');
      byId('wt-task-header-actions').hidden=view==='agents';byId('wt-project-tabs').hidden=view==='agents';byId('wt-agents-global').setAttribute('aria-pressed',String(view==='agents'));
      byId('wt-projects').innerHTML=projects.map(p=>{const n=tasks.filter(t=>t.project===p.id&&isActive(t)).length; return `<button type="button" class="wt-project" data-project="${p.id}" aria-pressed="${p.id===projectId}"><strong>${p.name}</strong><small>${n?n+' 项执行中':'项目工作区'}</small></button>`;}).join('');
      root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));
      byId('wt-toolbar').hidden=view!=='board';
      byId('wt-filters').hidden=view!=='board';
      root.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===layout)));
      root.querySelectorAll('[name="task-scope"]').forEach(r=>{r.checked=r.value===scope;});
      byId('wt-view-caption').textContent=layout==='list'?'任务列表与完整详情':'拖入进行中 → 执行';
      byId('wt-backlog').textContent='待规划 '+projectTasks().filter(t=>t.state==='backlog').length;
      const cancelled=projectTasks().filter(t=>t.state==='cancelled').length;
      byId('wt-cancelled').hidden=!cancelled; byId('wt-cancelled').textContent='已取消 '+cancelled;
      const content=byId('wt-content');
      if(view==='agents') renderAgents();
      if(view==='board'&&layout==='board') content.innerHTML='<div class="wt-board">'+['todo','doing','review','done'].map(state=>{const cards=shownTasks().filter(t=>column(t)===state); return `<section class="wt-column" data-column="${state}" aria-label="${labels[state]}列"><div class="wt-column-head"><span class="wt-dot" aria-hidden="true"></span><span>${labels[state]}</span><span class="wt-count">${cards.length}</span></div>${cards.map(taskMarkup).join('')}${!cards.length?'<div class="wt-empty">暂无任务</div>':''}</section>`;}).join('')+'</div>';
      if(view==='board'&&layout==='list') {
        const items=shownTasks();
        content.innerHTML=`<div class="wt-caption wt-selection-title">任务 · ${items.length} 项</div><label class="wt-picker">选择任务<select id="wt-task-picker" aria-label="选择任务"><option value="">选择一个任务</option>${items.map(t=>`<option value="${t.id}" ${selected===t.id?'selected':''}>${t.id} · ${escape(t.title)} · ${labels[t.state]}</option>`).join('')}</select></label><div class="wt-task-list">${items.map(t=>`<button type="button" class="wt-list-item" data-open="${t.id}" aria-pressed="${selected===t.id}"><div class="wt-list-item-head"><span>${t.id}</span><span>${labels[t.state]}</span></div><strong>${escape(t.title)}</strong><span>${escape(taskProject(t).name)} · ${escape(t.agent||'待选 Agent')}</span><span>${escape(runLabel(t))}</span></button>`).join('')}</div>`;
      }
      if(view==='terminal') {
        const t=taskById(selected)||projectTasks().find(t=>isActive(t))||projectTasks().find(t=>t.round);
        content.innerHTML=`<div class="wt-toolbar"><h3>${t?escape(t.id+' · '+t.title):'项目终端'}</h3><button type="button" class="wt-button" data-view="board">返回看板</button></div><div class="wt-terminal"><pre>${escape(t?'> '+t.agent+' · '+current.folder+String.fromCharCode(10,10)+t.history.join(String.fromCharCode(10))+String.fromCharCode(10,10)+(isActive(t)?'▍ 等待执行更新':'本次执行已结束，记录已保存。'):'> '+current.folder+String.fromCharCode(10)+'项目终端已就绪。')}</pre></div>`;
      }
      if(view==='summary') content.innerHTML=projectTasks().filter(t=>t.result).map(t=>`<div class="wt-summary-row"><span class="wt-caption">${t.id} · ${labels[t.state]}</span><h3>${escape(t.title)}</h3><div class="wt-description">${escape(t.result)}</div><button type="button" class="wt-button" data-open="${t.id}">查看任务</button></div>`).join('')||'<div class="wt-empty">任务交付后，结果会汇总在这里。</div>';
      const fullDetail=layout==='board'&&selected&&['view','new','start','stop','rework','finalize','delete'].includes(panelMode)&&view==='board';
      content.hidden=Boolean(fullDetail);
      byId('wt-stage').classList.toggle('wt-detail-open',Boolean(selected)&&view==='board');
      byId('wt-stage').classList.toggle('wt-list-layout',layout==='list'&&view==='board');
      byId('wt-stage').classList.toggle('wt-full-detail',Boolean(fullDetail));
      if(view==='board') renderPanel(); else { byId('wt-inspector').hidden=true; byId('wt-inspector').innerHTML=''; }
    }
    root.addEventListener('click',e=>{
      const b=e.target.closest('button'); if(!b) return;
      if(b.id==='wt-agents-global'||b.dataset.action==='manage-agents') {openAgents();return;}
      if(b.dataset.agent) {if(agentDirty())agentDraftCache.set(selectedAgentId||'new',structuredClone(agentDraft));selectedAgentId=b.dataset.agent;agentDraft=structuredClone(agentDraftCache.get(selectedAgentId)||agents.find(a=>a.id===selectedAgentId));agentPreview=false;render();return;}
      if(b.dataset.action&&(b.dataset.action.startsWith('agent-')||b.dataset.action==='agents-back')) {handleAgentAction(b.dataset.action);return;}
      if(b.dataset.submit) { const form=byId(b.dataset.submit); if(form.reportValidity()) form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true})); return; }
      if(b.dataset.project) { viewPreferences[projectId]={layout,selected:taskById(selected)?selected:null}; projectId=b.dataset.project; ({layout,selected}=viewPreferences[projectId]); panelMode='view'; scope='current'; view='board'; feedback('已切换项目，恢复这个项目上次使用的任务视图。'); render(); return; }
      if(b.dataset.layout) { layout=b.dataset.layout; selected=layout==='list'?(taskById(selected)?selected:shownTasks()[0]?.id):null; panelMode='view'; feedback('看板和列表展示同一批任务，共用完整任务详情。'); render(); return; }
      if(b.dataset.view) { view=b.dataset.view; render(); return; }
      if(b.dataset.open) { view='board'; showPanel(b.dataset.open); return; }
      if(b.dataset.restore) { requestMove(taskById(b.dataset.restore),'todo'); return; }
      if(b.id==='wt-new-task') { view='board'; showPanel('new','new'); return; }
      if(b.id==='wt-backlog'||b.id==='wt-cancelled') { showPanel('list',b.id==='wt-backlog'?'backlog':'cancelled'); return; }
      if(b.id==='wt-undo') { const action=undo; undo=null; byId('wt-undo').hidden=true; if(action) action(); return; }
      const t=taskById(selected);
      switch(b.dataset.action) {
        case 'close-panel': selected=null; render(); break;
        case 'cancel-change': panelMode='view'; targetState=null; render(); break;
        case 'accept': requestMove(t,'done'); break;
        case 'run-task': if(t.state==='backlog') applyMove(t,'todo'); requestMove(t,'doing'); break;
        case 'cancel-task': requestMove(t,'cancelled'); break;
        case 'task-finalize': if(!isActive(t))showPanel(t.id,'finalize');break;
        case 'task-delete': if(!isActive(t))showPanel(t.id,'delete');break;
        case 'confirm-finalize': t.worktreeCleaned=true;record(t,'你交付并清理了任务 Worktree，结果分支保留');panelMode='view';feedback('演示状态已更新：Worktree 已清理，任务与执行记录保留。');render();break;
        case 'confirm-delete': {const index=tasks.indexOf(t);if(index<0||isActive(t))break;stopTimers(t);tasks.splice(index,1);selected=layout==='list'?(shownTasks()[0]?.id||null):null;panelMode='view';render();feedback('任务已从演示列表中删除。',()=>{tasks.splice(index,0,t);selected=t.id;render();feedback('已恢复任务及其记录。');});break;}
        case 'rework': showPanel(t.id,'rework'); break;
        case 'open-terminal': view='terminal'; render(); break;
        case 'stop': showPanel(t.id,'stop','todo'); break;
        case 'confirm-stop': {
          const to=targetState; stopTimers(t); ++t.runToken; t.run='stopping'; panelMode='view'; feedback('正在停止 '+t.id+'…'); render();
          setTimeout(()=>{ t.run='stopped'; record(t,'你停止了执行，已有结果保留'); applyMove(t,to,false); },600); break;
        }
      }
    });
    root.addEventListener('input',e=>{
      if(e.target.closest('#wt-task-form')) draft[e.target.name]=e.target.value;
      if(e.target.closest('#wt-agent-form')) {agentDraft[e.target.name]=e.target.value;byId('wt-agent-dirty').textContent=agentDirty()?'有未保存的修改':'已保存';}
      if(e.target.id==='wt-agent-search') {agentQuery=e.target.value;renderAgentList();}
      if(e.target.closest('#wt-note-form')) noteDrafts[selected]=e.target.value;
      if(e.target.id==='wt-search') {query=e.target.value;render();}
    });
    root.addEventListener('change',e=>{
      if(e.target.name==='task-scope') {scope=e.target.value;render();}
      if(e.target.id==='wt-filter') {statusFilter=e.target.value;render();}
      if(e.target.id==='wt-agent-archived') {includeArchived=e.target.checked;renderAgentList();}
      if(e.target.id==='wt-task-picker') {if(e.target.value) showPanel(e.target.value);else {selected=null;render();}}
      if(e.target.dataset.criterion!==undefined) {const t=taskById(selected);t.criteriaChecks=Array.from(byId('wt-inspector').querySelectorAll('[data-criterion]')).map(c=>c.checked);t.checked=t.criteriaChecks.every(Boolean);}
      if(e.target.id==='wt-status') { const t=taskById(selected); const to=e.target.value; requestMove(t,to); const status=byId('wt-status'); if(status) status.value=t.state; }
    });
    root.addEventListener('submit',e=>{
      e.preventDefault(); const data=new FormData(e.target);
      if(e.target.id==='wt-agent-form') {
        const name=String(data.get('name')||'').trim();
        if(!name||agents.some(a=>a.name===name&&a.id!==selectedAgentId)) {feedback('请填写一个未被使用的 Agent 名称。');return;}
        const saved=agents.find(a=>a.id===selectedAgentId);const oldName=saved?.name;
        const next={id:saved?.id||'agent-'+Date.now(),name,description:String(data.get('description')||''),model:String(data.get('model')||''),instructions:String(data.get('instructions')||''),version:(saved?.version||0)+1,archived:saved?.archived||false};
        if(saved)Object.assign(saved,next);else agents.push(next);
        if(oldName!==name){projects.forEach(p=>{if(p.agent===oldName)p.agent=name;});tasks.forEach(t=>{if(t.agent===oldName)t.agent=name;});}
        selectedAgentId=next.id;agentDraftCache.delete(selectedAgentId);agentDraft=structuredClone(next);feedback('Agent 已保存为 v'+next.version+'，已有执行继续使用原配置。');render();return;
      }
      if(e.target.id==='wt-task-form') {
        const title=String(data.get('title')).trim(); if(!title) return;
        const t={id:(projectId==='wt'?'WT-':'RL-')+(30+tasks.length),project:projectId,title,state:'todo',agent:String(data.get('agent')||''),priority:'中',run:'idle',round:0,description:String(data.get('description')||'待补充任务要求和验收条件。'),history:['你创建了任务'],order:tasks.length+1,revision:0,runToken:0,executionMode:'Task 专属 Worktree',acceptance:String(data.get('acceptance')||'满足任务描述中的要求，并提供可检查的结果').split(String.fromCharCode(10)).map(x=>x.trim()).filter(Boolean),checked:false,model:String(data.get('model')||''),instructions:String(data.get('instructions')||'')}; tasks.push(t); selected=t.id; panelMode='view'; feedback(t.id+' 已创建到待办。'); render();
      }
      if(e.target.id==='wt-run-form') { const t=taskById(selected); t.agent=String(data.get('agent')); launch(t,String(data.get('comment')||'')); }
      if(e.target.id==='wt-reply-form') launch(taskById(selected),String(data.get('reply')),true);
      if(e.target.id==='wt-note-form') { const t=taskById(selected); record(t,'你补充：'+String(data.get('note')).trim()); delete noteDrafts[selected];feedback('补充要求已保存到当前任务，执行记录继续保留。'); render(); }
    });
    root.addEventListener('dragstart',e=>{const card=e.target.closest('[data-task]'); if(!card) return; dragId=card.dataset.task; e.dataTransfer.setData('text/plain',dragId); e.dataTransfer.effectAllowed='move'; card.classList.add('wt-dragging');});
    root.addEventListener('dragover',e=>{const zone=e.target.closest('[data-column]'); if(!zone||!dragId) return; e.preventDefault(); e.dataTransfer.dropEffect='move'; root.querySelectorAll('.wt-over').forEach(x=>x.classList.remove('wt-over')); zone.classList.add('wt-over');});
    root.addEventListener('dragleave',e=>{const zone=e.target.closest('[data-column]'); if(zone&&!zone.contains(e.relatedTarget)) zone.classList.remove('wt-over');});
    root.addEventListener('drop',e=>{
      const zone=e.target.closest('[data-column]'); if(!zone) return; e.preventDefault();
      const t=taskById(dragId||e.dataTransfer.getData('text/plain')); const target=e.target.closest('[data-task]'); dragId=null; root.querySelectorAll('.wt-over').forEach(x=>x.classList.remove('wt-over')); if(!t) return;
      if(t.project!==projectId&&scope!=='all') return;
      if(column(t)===zone.dataset.column) {
        if(target&&target.dataset.task===t.id) return;
        const peers=projectTasks().filter(x=>column(x)===column(t)&&x.id!==t.id);
        let position=peers.length;
        if(target) { const bounds=target.getBoundingClientRect(); position=peers.findIndex(x=>x.id===target.dataset.task)+(e.clientY>bounds.top+bounds.height/2?1:0); }
        peers.splice(Math.max(0,position),0,t); peers.forEach((x,i)=>{x.order=i;});
        record(t,'调整了卡片顺序'); feedback('卡片顺序已调整，执行状态保持不变。'); render(); return;
      }
      requestMove(t,zone.dataset.column);
    });
    root.addEventListener('dragend',()=>{dragId=null;root.querySelectorAll('.wt-over,.wt-dragging').forEach(x=>x.classList.remove('wt-over','wt-dragging'));});
    root.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&e.target.matches('input')&&e.target.closest('form')) { e.preventDefault(); const form=e.target.closest('form'); if(form.reportValidity()) form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true})); }
      if(e.key==='Escape'&&selected) { selected=null;targetState=null;render();byId('wt-new-task').focus(); }
    });
    render();
  })();
  </script>
</div>

</body>
</html>
